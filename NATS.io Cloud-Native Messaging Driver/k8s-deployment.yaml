apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-nats-messaging
  labels:
    app: cmox-plugin-nats-messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-nats-messaging
  template:
    metadata:
      labels:
        app: cmox-plugin-nats-messaging
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-nats-messaging:2.3.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-nats-messaging-svc
spec:
  selector:
    app: cmox-plugin-nats-messaging
  ports:
  - port: 7890
    targetPort: 7890
