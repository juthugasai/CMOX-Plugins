apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-mssql-bcp-ingest
  labels:
    app: cmox-plugin-mssql-bcp-ingest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-mssql-bcp-ingest
  template:
    metadata:
      labels:
        app: cmox-plugin-mssql-bcp-ingest
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-mssql-bcp-ingest:2.2.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-mssql-bcp-ingest-svc
spec:
  selector:
    app: cmox-plugin-mssql-bcp-ingest
  ports:
  - port: 7890
    targetPort: 7890
