apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-vercel-cache-invalidator
  labels:
    app: cmox-plugin-vercel-cache-invalidator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-vercel-cache-invalidator
  template:
    metadata:
      labels:
        app: cmox-plugin-vercel-cache-invalidator
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-vercel-cache-invalidator:2.3.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-vercel-cache-invalidator-svc
spec:
  selector:
    app: cmox-plugin-vercel-cache-invalidator
  ports:
  - port: 7890
    targetPort: 7890
