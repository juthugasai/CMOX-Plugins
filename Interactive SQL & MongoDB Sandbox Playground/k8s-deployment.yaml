apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-sql-playground-sandbox
  labels:
    app: cmox-plugin-sql-playground-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-sql-playground-sandbox
  template:
    metadata:
      labels:
        app: cmox-plugin-sql-playground-sandbox
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-sql-playground-sandbox:2.8.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-sql-playground-sandbox-svc
spec:
  selector:
    app: cmox-plugin-sql-playground-sandbox
  ports:
  - port: 7890
    targetPort: 7890
