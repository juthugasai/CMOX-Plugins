apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-rls-policy-manager
  labels:
    app: cmox-plugin-rls-policy-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-rls-policy-manager
  template:
    metadata:
      labels:
        app: cmox-plugin-rls-policy-manager
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-rls-policy-manager:2.6.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-rls-policy-manager-svc
spec:
  selector:
    app: cmox-plugin-rls-policy-manager
  ports:
  - port: 7890
    targetPort: 7890
