apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-schema-architect-ai
  labels:
    app: cmox-plugin-schema-architect-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-schema-architect-ai
  template:
    metadata:
      labels:
        app: cmox-plugin-schema-architect-ai
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-schema-architect-ai:2.9.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-schema-architect-ai-svc
spec:
  selector:
    app: cmox-plugin-schema-architect-ai
  ports:
  - port: 7890
    targetPort: 7890
