apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-rest-generator
  labels:
    app: cmox-plugin-rest-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-rest-generator
  template:
    metadata:
      labels:
        app: cmox-plugin-rest-generator
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-rest-generator:3.0.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-rest-generator-svc
spec:
  selector:
    app: cmox-plugin-rest-generator
  ports:
  - port: 7890
    targetPort: 7890
