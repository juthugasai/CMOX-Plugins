apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-postgres-native-wizard
  labels:
    app: cmox-plugin-postgres-native-wizard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-postgres-native-wizard
  template:
    metadata:
      labels:
        app: cmox-plugin-postgres-native-wizard
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-postgres-native-wizard:3.5.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-postgres-native-wizard-svc
spec:
  selector:
    app: cmox-plugin-postgres-native-wizard
  ports:
  - port: 7890
    targetPort: 7890
