apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-bi-dashboard-builder
  labels:
    app: cmox-plugin-bi-dashboard-builder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-bi-dashboard-builder
  template:
    metadata:
      labels:
        app: cmox-plugin-bi-dashboard-builder
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-bi-dashboard-builder:2.5.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-bi-dashboard-builder-svc
spec:
  selector:
    app: cmox-plugin-bi-dashboard-builder
  ports:
  - port: 7890
    targetPort: 7890
