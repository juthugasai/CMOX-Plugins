apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-flyio-read-replicas
  labels:
    app: cmox-plugin-flyio-read-replicas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-flyio-read-replicas
  template:
    metadata:
      labels:
        app: cmox-plugin-flyio-read-replicas
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-flyio-read-replicas:1.8.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-flyio-read-replicas-svc
spec:
  selector:
    app: cmox-plugin-flyio-read-replicas
  ports:
  - port: 7890
    targetPort: 7890
