apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-anomaly-detector
  labels:
    app: cmox-plugin-anomaly-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-anomaly-detector
  template:
    metadata:
      labels:
        app: cmox-plugin-anomaly-detector
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-anomaly-detector:1.6.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-anomaly-detector-svc
spec:
  selector:
    app: cmox-plugin-anomaly-detector
  ports:
  - port: 7890
    targetPort: 7890
