apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-multi-cloud-dr
  labels:
    app: cmox-plugin-multi-cloud-dr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-multi-cloud-dr
  template:
    metadata:
      labels:
        app: cmox-plugin-multi-cloud-dr
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-multi-cloud-dr:1.7.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-multi-cloud-dr-svc
spec:
  selector:
    app: cmox-plugin-multi-cloud-dr
  ports:
  - port: 7890
    targetPort: 7890
