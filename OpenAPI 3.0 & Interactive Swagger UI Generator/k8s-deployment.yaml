apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-swagger-openapi-ui
  labels:
    app: cmox-plugin-swagger-openapi-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-swagger-openapi-ui
  template:
    metadata:
      labels:
        app: cmox-plugin-swagger-openapi-ui
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-swagger-openapi-ui:2.3.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-swagger-openapi-ui-svc
spec:
  selector:
    app: cmox-plugin-swagger-openapi-ui
  ports:
  - port: 7890
    targetPort: 7890
