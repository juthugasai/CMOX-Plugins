apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-incremental-backup
  labels:
    app: cmox-plugin-incremental-backup
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-incremental-backup
  template:
    metadata:
      labels:
        app: cmox-plugin-incremental-backup
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-incremental-backup:2.0.5
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-incremental-backup-svc
spec:
  selector:
    app: cmox-plugin-incremental-backup
  ports:
  - port: 7890
    targetPort: 7890
