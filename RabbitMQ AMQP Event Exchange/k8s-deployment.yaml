apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-rabbitmq-exchange
  labels:
    app: cmox-plugin-rabbitmq-exchange
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-rabbitmq-exchange
  template:
    metadata:
      labels:
        app: cmox-plugin-rabbitmq-exchange
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-rabbitmq-exchange:1.8.2
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-rabbitmq-exchange-svc
spec:
  selector:
    app: cmox-plugin-rabbitmq-exchange
  ports:
  - port: 7890
    targetPort: 7890
