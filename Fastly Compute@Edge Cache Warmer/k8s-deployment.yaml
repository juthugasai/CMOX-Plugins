apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-fastly-compute-warmer
  labels:
    app: cmox-plugin-fastly-compute-warmer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-fastly-compute-warmer
  template:
    metadata:
      labels:
        app: cmox-plugin-fastly-compute-warmer
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-fastly-compute-warmer:1.3.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-fastly-compute-warmer-svc
spec:
  selector:
    app: cmox-plugin-fastly-compute-warmer
  ports:
  - port: 7890
    targetPort: 7890
