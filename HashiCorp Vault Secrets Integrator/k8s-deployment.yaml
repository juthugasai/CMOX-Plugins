apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-vault-secrets
  labels:
    app: cmox-plugin-vault-secrets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-vault-secrets
  template:
    metadata:
      labels:
        app: cmox-plugin-vault-secrets
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-vault-secrets:2.1.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-vault-secrets-svc
spec:
  selector:
    app: cmox-plugin-vault-secrets
  ports:
  - port: 7890
    targetPort: 7890
