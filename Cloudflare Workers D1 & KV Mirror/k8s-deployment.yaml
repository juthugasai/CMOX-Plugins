apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-cloudflare-workers-d1
  labels:
    app: cmox-plugin-cloudflare-workers-d1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-cloudflare-workers-d1
  template:
    metadata:
      labels:
        app: cmox-plugin-cloudflare-workers-d1
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-cloudflare-workers-d1:2.9.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-cloudflare-workers-d1-svc
spec:
  selector:
    app: cmox-plugin-cloudflare-workers-d1
  ports:
  - port: 7890
    targetPort: 7890
