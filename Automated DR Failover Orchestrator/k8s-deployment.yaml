apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-auto-failover
  labels:
    app: cmox-plugin-auto-failover
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-auto-failover
  template:
    metadata:
      labels:
        app: cmox-plugin-auto-failover
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-auto-failover:1.5.1
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-auto-failover-svc
spec:
  selector:
    app: cmox-plugin-auto-failover
  ports:
  - port: 7890
    targetPort: 7890
