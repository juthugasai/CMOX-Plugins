apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-lambda-serverless-trigger
  labels:
    app: cmox-plugin-lambda-serverless-trigger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-lambda-serverless-trigger
  template:
    metadata:
      labels:
        app: cmox-plugin-lambda-serverless-trigger
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-lambda-serverless-trigger:2.7.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-lambda-serverless-trigger-svc
spec:
  selector:
    app: cmox-plugin-lambda-serverless-trigger
  ports:
  - port: 7890
    targetPort: 7890
