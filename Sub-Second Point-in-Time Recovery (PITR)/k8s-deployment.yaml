apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-pitr-recovery
  labels:
    app: cmox-plugin-pitr-recovery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-pitr-recovery
  template:
    metadata:
      labels:
        app: cmox-plugin-pitr-recovery
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-pitr-recovery:3.0.1
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-pitr-recovery-svc
spec:
  selector:
    app: cmox-plugin-pitr-recovery
  ports:
  - port: 7890
    targetPort: 7890
