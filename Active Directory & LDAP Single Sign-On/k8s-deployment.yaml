apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-active-directory-ldap
  labels:
    app: cmox-plugin-active-directory-ldap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-active-directory-ldap
  template:
    metadata:
      labels:
        app: cmox-plugin-active-directory-ldap
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-active-directory-ldap:3.0.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-active-directory-ldap-svc
spec:
  selector:
    app: cmox-plugin-active-directory-ldap
  ports:
  - port: 7890
    targetPort: 7890
