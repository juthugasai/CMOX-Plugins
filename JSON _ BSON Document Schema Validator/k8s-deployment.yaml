apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-json-validator
  labels:
    app: cmox-plugin-json-validator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-json-validator
  template:
    metadata:
      labels:
        app: cmox-plugin-json-validator
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-json-validator:1.9.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-json-validator-svc
spec:
  selector:
    app: cmox-plugin-json-validator
  ports:
  - port: 7890
    targetPort: 7890
