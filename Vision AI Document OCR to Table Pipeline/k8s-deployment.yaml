apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-vision-ocr-pipeline
  labels:
    app: cmox-plugin-vision-ocr-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-vision-ocr-pipeline
  template:
    metadata:
      labels:
        app: cmox-plugin-vision-ocr-pipeline
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-vision-ocr-pipeline:1.5.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-vision-ocr-pipeline-svc
spec:
  selector:
    app: cmox-plugin-vision-ocr-pipeline
  ports:
  - port: 7890
    targetPort: 7890
