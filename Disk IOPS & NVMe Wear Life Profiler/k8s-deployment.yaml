apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-disk-iops-profiler
  labels:
    app: cmox-plugin-disk-iops-profiler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-disk-iops-profiler
  template:
    metadata:
      labels:
        app: cmox-plugin-disk-iops-profiler
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-disk-iops-profiler:1.3.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-disk-iops-profiler-svc
spec:
  selector:
    app: cmox-plugin-disk-iops-profiler
  ports:
  - port: 7890
    targetPort: 7890
