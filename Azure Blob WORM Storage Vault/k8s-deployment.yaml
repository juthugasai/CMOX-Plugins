apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmox-plugin-azure-blob-vault
  labels:
    app: cmox-plugin-azure-blob-vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmox-plugin-azure-blob-vault
  template:
    metadata:
      labels:
        app: cmox-plugin-azure-blob-vault
    spec:
      containers:
      - name: plugin
        image: cmox/plugin-azure-blob-vault:1.9.0
        ports:
        - containerPort: 7890
        livenessProbe:
          httpGet:
            path: /health
            port: 7890
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmox-plugin-azure-blob-vault-svc
spec:
  selector:
    app: cmox-plugin-azure-blob-vault
  ports:
  - port: 7890
    targetPort: 7890
